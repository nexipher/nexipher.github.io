  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  {% assign description = page.description | default: site.description %}
  <meta name="description" content="{{ description | strip_html | escape }}" />
  <meta name="author" content="{{ site.name | escape }}" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ page.title | default: site.name | escape }}" />
  <meta property="og:description" content="{{ description | strip_html | escape }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:image" content="{{ site.avatar | absolute_url }}" />
