<!DOCTYPE html>
<html lang="zh-CN">
{% include head.html %}

  <body>
    <a class="skip-link" href="#main">跳转到正文</a>
    <div class="wrapper-masthead" role="banner">
      <div class="container">
        <header class="masthead">
          <a href="{{ site.baseurl }}/" class="site-avatar" aria-label="返回首页">
            <img src="{{ site.avatar | relative_url }}" alt="{{ site.name }}的头像" width="48" height="48" />
          </a>

          <div class="site-info">
            <div class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></div>
            <p class="site-description">{{ site.description }}</p>
          </div>

          <nav aria-label="主导航">
            <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>首页</a>
            <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
            <a href="{{ '/thanks/' | relative_url }}"{% if page.url == '/thanks/' %} aria-current="page"{% endif %}>Thanks</a>
          </nav>
        </header>
      </div>
    </div>

    <main id="main" class="container" tabindex="-1">
      {{ content }}
    </main>

    <div class="wrapper-footer" role="contentinfo">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

  </body>
</html>
